# CORS Configuration for Vue.js frontend
spring.web.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Application properties
server.port=8080
spring.application.name=students

# JPA/H2 Database Configuration (?????? ?????????)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (??? ???????)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ????????? lazy initialization (????? ??? ?????????? ?????)
spring.main.lazy-initialization=false
